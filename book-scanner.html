<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📚 書籍スキャナー</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }

header { background: #1e293b; border-bottom: 1px solid #1e3a5f; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; font-weight: 700; color: #f8fafc; }
header p { font-size: 12px; color: #64748b; margin-top: 2px; }
.sbadge { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #1e3a5f; color: #60a5fa; white-space: nowrap; }

main { max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.card { background: #1e293b; border-radius: 14px; border: 1px solid #334155; overflow: hidden; }
.card-header { padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; }

/* html5-qrcode のデフォルトUIを上書き */
#reader { width: 100% !important; border: none !important; }
#reader video { width: 100% !important; }
#reader img { display: none !important; }
#reader__scan_region { background: #000; }
#reader__dashboard { background: #1e293b; padding: 10px 16px; }
#reader__dashboard_section_swaplink { color: #60a5fa; font-size: 13px; }
#reader__status_span { color: #94a3b8; font-size: 12px; }
#reader__camera_selection { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 100%; margin-bottom: 8px; }
#reader__camera_permission_button,
#html5-qrcode-button-camera-permission,
#html5-qrcode-button-camera-start,
#html5-qrcode-button-camera-stop { background: #1d4ed8 !important; color: #fff !important; border: none !important; border-radius: 8px !important; padding: 10px 16px !important; font-size: 14px !important; font-weight: 600 !important; cursor: pointer !important; width: 100% !important; margin: 4px 0 !important; }
#html5-qrcode-button-camera-stop { background: #991b1b !important; }
#html5-qrcode-anchor-scan-type-change { color: #60a5fa; font-size: 12px; }

/* scan frame overlay */
#reader__scan_region > img { display: none !important; }

.controls { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.btn { width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 15px; }
.btn-green { background: #047857; color: #fff; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 15px; outline: none; -webkit-appearance: none; }
.row input:focus { border-color: #3b82f6; }
.row input::placeholder { color: #475569; }
.row .btn { width: auto; padding: 12px 18px; font-size: 14px; flex-shrink: 0; background: #1d4ed8; color: #fff; }

.msg { padding: 10px 13px; border-radius: 10px; font-size: 13px; display: none; }
.msg.show { display: block; }
.msg-ok  { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
.msg-err { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }

.steps { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.step { background: #0f172a; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 10px; }
.step-num { background: #1d4ed8; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }

#book-list { max-height: 360px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.empty { padding: 44px 20px; text-align: center; color: #475569; }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.book-item { padding: 11px 16px; border-bottom: 1px solid #1e3a5f; display: flex; gap: 10px; align-items: flex-start; }
.book-item:last-child { border-bottom: none; }
.thumb-box { width: 40px; height: 56px; border-radius: 4px; flex-shrink: 0; background: #1e3a5f; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
.thumb-box img { width: 100%; height: 100%; object-fit: cover; }
.binfo { flex: 1; min-width: 0; }
.btitle { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bauthor { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.bmeta { font-size: 11px; color: #64748b; margin-top: 2px; }
.btn-del { border: 1px solid #334155; background: transparent; color: #64748b; cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 6px; flex-shrink: 0; }

footer { text-align: center; font-size: 11px; color: #334155; padding: 0 16px 24px; }
</style>
</head>
<body>

<header>
  <span style="font-size:24px">📚</span>
  <div>
    <h1>書籍スキャナー</h1>
    <p>バーコード読み取り → 書籍リスト作成</p>
  </div>
  <span class="sbadge" id="sbadge">待機中</span>
</header>

<main>
  <div class="card">
    <div class="card-header">📷 バーコードスキャン</div>
    <!-- html5-qrcode がここにカメラUIを自動生成 -->
    <div id="reader"></div>
    <div class="controls">
      <div class="row">
        <input id="isbn-input" type="tel" placeholder="ISBN を手入力 (13桁)" inputmode="numeric"
          onkeydown="if(event.key==='Enter'){addManual();this.blur()}">
        <button class="btn" onclick="addManual()">追加</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="card" id="how-card">
    <div class="card-header">💡 使い方</div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div>「カメラを起動」をタップしてカメラを許可</div>
      <div class="step"><div class="step-num">2</div>本の裏のバーコード（ISBN）をフレームに合わせる</div>
      <div class="step"><div class="step-num">3</div>自動で書籍情報を取得・リストに追加</div>
      <div class="step"><div class="step-num">4</div>「CSV ダウンロード」で保存</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      📋 書籍リスト&ensp;<span id="count" style="color:#3b82f6;font-size:13px">0冊</span>
      <button class="btn btn-green" id="dl-btn" onclick="downloadCSV()" style="display:none;width:auto;padding:7px 14px;font-size:13px">⬇ CSV</button>
    </div>
    <div id="book-list">
      <div class="empty"><div class="empty-icon">📖</div><p>まだ書籍がありません</p></div>
    </div>
  </div>

  <footer>書籍情報は Google Books API より取得</footer>
</main>

<script>
let books = [];
let lastCode = '', lastTime = 0;
let scanner = null;

const COLORS = {idle:'#64748b',scanning:'#3b82f6',fetching:'#f59e0b',success:'#10b981',error:'#ef4444'};
const LABELS = {idle:'待機中',scanning:'スキャン中',fetching:'取得中…',success:'登録完了！',error:'エラー'};

function setStatus(s){
  const b = document.getElementById('sbadge');
  b.textContent = LABELS[s]; b.style.color = COLORS[s];
  b.style.background = COLORS[s]+'22';
}

function toast(msg, ok=false){
  const el = document.getElementById('msg');
  el.textContent = (ok?'✓ ':'⚠ ') + msg;
  el.className = 'msg show ' + (ok?'msg-ok':'msg-err');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 3500);
}

// html5-qrcode を初期化
window.addEventListener('load', () => {
  scanner = new Html5QrcodeScanner('reader', {
    fps: 10,
    qrbox: { width: 250, height: 120 },
    rememberLastUsedCamera: true,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
    ],
    showTorchButtonIfSupported: true,
  }, false);

  scanner.render(
    (code) => {
      const now = Date.now();
      if (code === lastCode && now - lastTime < 4000) return;
      lastCode = code; lastTime = now;
      setStatus('fetching');
      addBook(code);
    },
    (err) => { /* スキャン中エラーは無視 */ }
  );

  // ボタンが描画されたらステータスを scanning に
  const observer = new MutationObserver(() => {
    const stopBtn = document.getElementById('html5-qrcode-button-camera-stop');
    if (stopBtn) setStatus('scanning');
  });
  observer.observe(document.getElementById('reader'), { childList: true, subtree: true });
});

async function fetchBook(isbn){
  const clean = isbn.replace(/[^0-9X]/gi, '');
  const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${clean}`);
  const d = await r.json();
  if (!d.items?.length) throw new Error('書籍が見つかりません (' + clean + ')');
  const v = d.items[0].volumeInfo || {};
  return {
    id: Date.now(),
    isbn: (v.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')?.identifier ||
          (v.industryIdentifiers||[]).find(i=>i.type==='ISBN_10')?.identifier || clean,
    title: v.title || '不明',
    authors: (v.authors||[]).join(', ') || '不明',
    publisher: v.publisher || '—',
    publishedDate: v.publishedDate || '—',
    pageCount: v.pageCount || '—',
    categories: (v.categories||[]).join(', ') || '—',
    thumbnail: v.imageLinks?.thumbnail || null,
    description: (v.description||'').slice(0, 100) || '—',
  };
}

async function addBook(isbn){
  const clean = isbn.replace(/[^0-9X]/gi, '');
  if (clean.length < 8) { toast('ISBN が短すぎます'); setStatus('scanning'); return; }
  if (books.find(b => b.isbn === clean)) { toast('すでに登録済みです'); setStatus('scanning'); return; }
  try {
    const book = await fetchBook(isbn);
    books.unshift(book);
    renderList();
    setStatus('success');
    toast(book.title + ' を登録しました', true);
    setTimeout(() => setStatus('scanning'), 2000);
  } catch(e) {
    setStatus('error');
    toast(e.message);
    setTimeout(() => setStatus('scanning'), 2500);
  }
}

function addManual(){
  const v = document.getElementById('isbn-input').value.trim();
  if (!v) return;
  addBook(v);
  document.getElementById('isbn-input').value = '';
}

function renderList(){
  document.getElementById('count').textContent = books.length + '冊';
  document.getElementById('dl-btn').style.display = books.length ? 'inline-block' : 'none';
  document.getElementById('how-card').style.display = books.length ? 'none' : 'block';
  const el = document.getElementById('book-list');
  if (!books.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><p>まだ書籍がありません</p></div>`;
    return;
  }
  el.innerHTML = books.map(b => `
    <div class="book-item">
      <div class="thumb-box">${b.thumbnail ? `<img src="${b.thumbnail}" alt="">` : '📗'}</div>
      <div class="binfo">
        <div class="btitle" title="${x(b.title)}">${x(b.title)}</div>
        <div class="bauthor">${x(b.authors)}</div>
        <div class="bmeta">${x(b.publisher)} · ${b.publishedDate} · ${b.pageCount}p</div>
      </div>
      <button class="btn-del" onclick="removeBook(${b.id})">削除</button>
    </div>`).join('');
}

function x(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function removeBook(id){ books = books.filter(b => b.id !== id); renderList(); }

function downloadCSV(){
  const H = ['ISBN','タイトル','著者','出版社','出版日','ページ数','カテゴリ','概要'];
  const rows = books.map(b =>
    [b.isbn,b.title,b.authors,b.publisher,b.publishedDate,b.pageCount,b.categories,b.description]
    .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
  );
  const csv = '\uFEFF' + [H.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `書籍リスト_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.csv`;
  a.click();
}
</script>
</body>
</html>
